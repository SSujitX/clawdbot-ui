name: Create Release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag_name:
        required: true
        type: string

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous tag
        id: get_previous_tag
        run: |
          currentTag="${{ inputs.tag_name }}"
          previousTag=$(git tag --sort=-version:refname | grep -v "$currentTag" | head -n 1)
          if [ -n "$previousTag" ]; then
            echo "previous_tag=$previousTag" >> $GITHUB_OUTPUT
            echo "Previous tag: $previousTag"
          else
            echo "previous_tag=" >> $GITHUB_OUTPUT
            echo "No previous tag found"
          fi

      - name: Extract release notes from CHANGELOG
        id: get_release_notes
        run: |
          version="${{ inputs.version }}"
          
          if [ -f "CHANGELOG.md" ]; then
            releaseNotes=$(awk "/## v$version/,/## v/" CHANGELOG.md | sed '1d;$d')
            
            if [ -n "$releaseNotes" ]; then
              echo "release_notes<<EOF" >> $GITHUB_OUTPUT
              echo "$releaseNotes" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
              echo "Successfully extracted release notes for version $version"
            else
              defaultNotes="## What's New
          - Latest version of ClawdBot Control Panel
          - Bug fixes and improvements"
              echo "release_notes<<EOF" >> $GITHUB_OUTPUT
              echo "$defaultNotes" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
              echo "Could not find specific version notes, using default"
            fi
          else
            defaultNotes="## What's New
          - Latest version of ClawdBot Control Panel
          - Bug fixes and improvements"
            echo "release_notes<<EOF" >> $GITHUB_OUTPUT
            echo "$defaultNotes" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "CHANGELOG.md not found, using default"
          fi

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: 🦞 ClawdBot Control Panel ${{ inputs.tag_name }}
          body: |
            ${{ steps.get_release_notes.outputs.release_notes }}

            ## 📥 Downloads

            Choose the version for your platform:
            - **Windows**: ClawdBot-Control-Panel-v${{ inputs.version }}-Windows.exe
            - **macOS**: ClawdBot-Control-Panel-v${{ inputs.version }}-macOS.zip

            ## 💻 System Requirements

            **Windows**:
            - Windows 10/11 (64-bit)
            - No additional dependencies required

            **macOS**:
            - macOS 11.0+
            - Extract .zip and run the .app

            ## 🚀 Quick Start

            1. Download the file for your platform
            2. **Windows**: Run the .exe file
            3. **macOS**: Extract .zip and open the .app
            4. Control your ClawdBot gateway from the UI

            ---

            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.get_previous_tag.outputs.previous_tag }}...${{ inputs.tag_name }}
          draft: false
          prerelease: false
          files: |
            dist/*.exe
            dist/*.zip
          fail_on_unmatched_files: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
