name: Build Windows

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install pyqt6 websockets pyinstaller pillow

      - name: Build Windows executable
        run: |
          # Use PyInstaller with ; separator for add-data on Windows
          pyinstaller --name "ClawdBot-Control-Panel" --onefile --windowed --icon="assets/clawdbot.png" --add-data="assets;assets" --noconfirm --clean main.py

      - name: Rename executable
        run: |
          $version = "${{ inputs.version }}"
          $oldPath = "dist\ClawdBot-Control-Panel.exe"
          $newPath = "dist\ClawdBot-Control-Panel-v$version-Windows.exe"
          Move-Item -Path $oldPath -Destination $newPath
          echo "Renamed to: ClawdBot-Control-Panel-v$version-Windows.exe"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
          retention-days: 1
