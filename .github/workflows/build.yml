name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install pyqt6 websockets nuitka imageio

      - name: Extract version from tag
        id: get_version
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version"
        shell: pwsh

      - name: Build Windows executable
        run: |
          python -m nuitka --mode=onefile --enable-plugin=pyqt6 --windows-console-mode=disable --assume-yes-for-downloads --output-dir=build --output-file="ClawdBot-Control-Panel" main.py

      - name: Rename Windows executable
        run: |
          $version = "${{ steps.get_version.outputs.version }}"
          $oldPath = "build\ClawdBot-Control-Panel.exe"
          $newPath = "build\ClawdBot-Control-Panel-v$version-Windows.exe"
          Move-Item -Path $oldPath -Destination $newPath
          echo "Renamed to: ClawdBot-Control-Panel-v$version-Windows.exe"
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: build/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install pyqt6 websockets nuitka imageio

      - name: Extract version from tag
        id: get_version
        run: |
          version="${{ github.ref_name }}"
          version="${version#v}"
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Version: $version"

      - name: Build macOS app
        run: |
          python -m nuitka --mode=standalone --enable-plugin=pyqt6 --macos-create-app-bundle --macos-app-icon=assets/clawdbot.png --assume-yes-for-downloads --output-dir=build --output-file="ClawdBot-Control-Panel" main.py

      - name: Create macOS zip
        run: |
          version="${{ steps.get_version.outputs.version }}"
          cd build
          zip -r "ClawdBot-Control-Panel-v$version-macOS.zip" *.app || zip -r "ClawdBot-Control-Panel-v$version-macOS.zip" main.dist
          echo "Created: ClawdBot-Control-Panel-v$version-macOS.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: build/*.zip

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: get_version
        run: |
          version="${{ github.ref_name }}"
          version="${version#v}"
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Version: $version"

      - name: Get previous tag
        id: get_previous_tag
        run: |
          currentTag="${{ github.ref_name }}"
          previousTag=$(git tag --sort=-version:refname | grep -v "$currentTag" | head -n 1)
          if [ -n "$previousTag" ]; then
            echo "previous_tag=$previousTag" >> $GITHUB_OUTPUT
            echo "Previous tag: $previousTag"
          else
            echo "previous_tag=" >> $GITHUB_OUTPUT
            echo "No previous tag found"
          fi

      - name: Extract release notes from CHANGELOG
        id: get_release_notes
        run: |
          version="${{ steps.get_version.outputs.version }}"
          
          if [ -f "CHANGELOG.md" ]; then
            # Extract the section for this version
            releaseNotes=$(awk "/## v$version/,/## v/" CHANGELOG.md | sed '1d;$d')
            
            if [ -n "$releaseNotes" ]; then
              echo "release_notes<<EOF" >> $GITHUB_OUTPUT
              echo "$releaseNotes" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
              echo "Successfully extracted release notes for version $version"
            else
              defaultNotes="## What's New
          - Latest version of ClawdBot Control Panel
          - Bug fixes and improvements"
              echo "release_notes<<EOF" >> $GITHUB_OUTPUT
              echo "$defaultNotes" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
              echo "Could not find specific version notes, using default"
            fi
          else
            defaultNotes="## What's New
          - Latest version of ClawdBot Control Panel
          - Bug fixes and improvements"
            echo "release_notes<<EOF" >> $GITHUB_OUTPUT
            echo "$defaultNotes" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "CHANGELOG.md not found, using default"
          fi

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 🦞 ClawdBot Control Panel ${{ github.ref_name }}
          body: |
            ${{ steps.get_release_notes.outputs.release_notes }}

            ## 📥 Downloads

            Choose the version for your platform:
            - **Windows**: ClawdBot-Control-Panel-v${{ steps.get_version.outputs.version }}-Windows.exe
            - **macOS**: ClawdBot-Control-Panel-v${{ steps.get_version.outputs.version }}-macOS.zip

            ## 💻 System Requirements

            **Windows**:
            - Windows 10/11 (64-bit)
            - No additional dependencies required

            **macOS**:
            - macOS 11.0+
            - Extract .zip and run the .app

            ## 🚀 Quick Start

            1. Download the file for your platform
            2. **Windows**: Run the .exe file
            3. **macOS**: Extract .zip and open the .app
            4. Control your ClawdBot gateway from the UI

            ---

            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.get_previous_tag.outputs.previous_tag }}...${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/*.exe
            dist/*.zip
          fail_on_unmatched_files: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
