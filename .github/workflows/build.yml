name: Build & Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: ClawdBot-Control-Panel-Windows.exe
          - os: macos-latest
            artifact_name: ClawdBot-Control-Panel-macOS.app.zip

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install UV
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Build with Nuitka (Windows)
        if: matrix.os == 'windows-latest'
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: main.py
          mode: onefile
          enable-plugins: pyqt6
          windows-console-mode: disable
          output-file: ClawdBot-Control-Panel-Windows

      - name: Build with Nuitka (macOS)
        if: matrix.os == 'macos-latest'
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: main.py
          mode: app
          enable-plugins: pyqt6
          macos-app-icon: assets/clawdbot.png
          output-file: ClawdBot-Control-Panel-macOS

      - name: Zip macOS app
        if: matrix.os == 'macos-latest'
        run: |
          cd build
          zip -r ClawdBot-Control-Panel-macOS.app.zip *.app

      - name: Upload Windows Artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/*.exe

      - name: Upload macOS Artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: build/*.zip

      - name: Upload to Release (Windows)
        if: matrix.os == 'windows-latest' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.exe

      - name: Upload to Release (macOS)
        if: matrix.os == 'macos-latest' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
