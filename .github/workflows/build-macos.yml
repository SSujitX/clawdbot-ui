name: Build macOS

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install pyqt6 websockets pyinstaller

      - name: Build macOS app
        run: |
          # Use PyInstaller for macOS as Nuitka has issues with PyQt6 on Mac
          pyinstaller --name "ClawdBot-Control-Panel" --windowed --icon="assets/clawdbot.png" --add-data="assets:assets" --noconfirm --clean main.py

      - name: Create macOS zip
        run: |
          version="${{ inputs.version }}"
          cd dist
          zip -r "ClawdBot-Control-Panel-v$version-macOS.zip" "ClawdBot-Control-Panel.app"
          echo "Created: ClawdBot-Control-Panel-v$version-macOS.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: build/*.zip
          retention-days: 1
