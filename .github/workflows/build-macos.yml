name: Build macOS

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install pyqt6 websockets nuitka imageio

      - name: Build macOS app
        run: |
          python -m nuitka --mode=app --enable-plugin=pyqt6 --macos-app-icon=assets/clawdbot.png --include-data-dir=assets=assets --assume-yes-for-downloads --output-dir=build --output-file="ClawdBot-Control-Panel" main.py

      - name: Create macOS zip
        run: |
          version="${{ inputs.version }}"
          cd build
          zip -r "ClawdBot-Control-Panel-v$version-macOS.zip" *.app || zip -r "ClawdBot-Control-Panel-v$version-macOS.zip" main.dist
          echo "Created: ClawdBot-Control-Panel-v$version-macOS.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: build/*.zip
          retention-days: 1
