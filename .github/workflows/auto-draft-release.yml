name: Auto-Create Draft Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v1.2.3, etc.

permissions:
  contents: write

jobs:
  create-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          if [ -f "CHANGELOG.md" ]; then
            # Extract content between this version and the next (or end of file)
            # Using awk to get content between version headers
            RELEASE_NOTES=$(awk "/## v$VERSION/,/## v[0-9]/" CHANGELOG.md | sed '1d;$d' | sed '/^$/d')
            
            if [ -z "$RELEASE_NOTES" ]; then
              # Fallback if extraction fails
              RELEASE_NOTES="## What's New in v$VERSION

          Check the [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for details."
            fi
            
            # Save to output using heredoc
            {
              echo 'notes<<EOF'
              echo "$RELEASE_NOTES"
              echo 'EOF'
            } >> $GITHUB_OUTPUT
            
            echo "Successfully extracted release notes for v$VERSION"
          else
            echo "CHANGELOG.md not found!"
            exit 1
          fi

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ClawdBot Control Panel ${{ steps.version.outputs.tag }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
