name: Auto-Create Draft Release

on:
  push:
    branches:
      - master  # Triggers on every push to master

permissions:
  contents: write

jobs:
  create-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract latest version from CHANGELOG
        id: version
        run: |
          if [ ! -f "CHANGELOG.md" ]; then
            echo "CHANGELOG.md not found!"
            exit 1
          fi
          
          # Extract the first version header (latest version)
          # Matches "## v1.0.0", "## [1.0.0]", "## 1.0.0" etc.
          VERSION=$(grep -m 1 "^## " CHANGELOG.md | sed -E 's/^## \[?v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          
          if [ -z "$VERSION" ]; then
            echo "No version found in CHANGELOG.md!"
            exit 1
          fi
          
          TAG_NAME="v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION (tag: $TAG_NAME)"

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          # Find the line number of the current version header
          CURRENT_VERSION_LINE=$(grep -n "^## .*$VERSION" CHANGELOG.md | head -1 | cut -d: -f1)
          
          if [ -z "$CURRENT_VERSION_LINE" ]; then
            echo "Could not locate version $VERSION in CHANGELOG.md"
            exit 1
          fi

          # Find the line number of the NEXT version header (starting from line after current)
          # We look for any line starting with "## " followed by a number or bracket+number
          NEXT_VERSION_LINE=$(tail -n +$((CURRENT_VERSION_LINE + 1)) CHANGELOG.md | grep -n "^## " | head -1 | cut -d: -f1)
          
          if [ -z "$NEXT_VERSION_LINE" ]; then
            # No next version found, extract until end of file
            RELEASE_NOTES=$(tail -n +$((CURRENT_VERSION_LINE + 1)) CHANGELOG.md)
          else
            # Calculate real line number of next version
            REAL_NEXT_LINE=$((CURRENT_VERSION_LINE + NEXT_VERSION_LINE))
            # Extract content between current and next version
            RELEASE_NOTES=$(sed -n "$((CURRENT_VERSION_LINE + 1)),$((REAL_NEXT_LINE - 1))p" CHANGELOG.md)
          fi
          
          # Trim empty lines at start and end
          RELEASE_NOTES=$(echo "$RELEASE_NOTES" | sed '/./,$!d' | sed -e :a -e '/^\s*$/d;N;ba')
          
          if [ -z "$RELEASE_NOTES" ]; then
            echo "No release notes found for v$VERSION!"
            exit 1
          fi
          
          # Save to output using heredoc
          {
            echo 'notes<<EOF'
            echo "$RELEASE_NOTES"
            echo 'EOF'
          } >> $GITHUB_OUTPUT
          
          echo "Successfully extracted release notes for v$VERSION"

      - name: Create or update draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
