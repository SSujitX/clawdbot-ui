name: Auto-Create Draft Release

on:
  push:
    branches:
      - master  # Triggers on every push to master

permissions:
  contents: write

jobs:
  create-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract latest version from CHANGELOG
        id: version
        run: |
          if [ ! -f "CHANGELOG.md" ]; then
            echo "CHANGELOG.md not found!"
            exit 1
          fi
          
          # Extract the first version header (latest version)
          VERSION=$(grep -m 1 "^## v" CHANGELOG.md | sed 's/^## v\([0-9.]*\).*/\1/')
          
          if [ -z "$VERSION" ]; then
            echo "No version found in CHANGELOG.md!"
            exit 1
          fi
          
          TAG_NAME="v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION (tag: $TAG_NAME)"

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          # Extract content between this version and the next version header (or end of file)
          # First, try to find a second version header
          NEXT_VERSION_LINE=$(grep -n "^## v[0-9]" CHANGELOG.md | grep -A 1 "^## v$VERSION" | tail -1 | cut -d: -f1)
          CURRENT_VERSION_LINE=$(grep -n "^## v$VERSION" CHANGELOG.md | head -1 | cut -d: -f1)
          
          if [ -z "$NEXT_VERSION_LINE" ] || [ "$NEXT_VERSION_LINE" == "$CURRENT_VERSION_LINE" ]; then
            # This is the last/only version, extract till end of file
            RELEASE_NOTES=$(awk "/## v$VERSION/,EOF" CHANGELOG.md | tail -n +2)
          else
            # Extract between current and next version
            RELEASE_NOTES=$(awk "/## v$VERSION/,/^## v[0-9]/" CHANGELOG.md | sed '1d;$d')
          fi
          
          # Trim empty lines at start and end
          RELEASE_NOTES=$(echo "$RELEASE_NOTES" | sed '/./,$!d' | sed -e :a -e '/^\s*$/d;N;ba')
          
          if [ -z "$RELEASE_NOTES" ]; then
            echo "No release notes found for v$VERSION!"
            exit 1
          fi
          
          # Save to output using heredoc
          {
            echo 'notes<<EOF'
            echo "$RELEASE_NOTES"
            echo 'EOF'
          } >> $GITHUB_OUTPUT
          
          echo "Successfully extracted release notes for v$VERSION"

      - name: Create or update draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
