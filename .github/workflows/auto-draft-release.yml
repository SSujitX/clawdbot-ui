name: Auto-Create Draft Release

on:
  push:
    branches:
      - master  # Triggers on every push to master

permissions:
  contents: write

jobs:
  create-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract latest version from CHANGELOG
        id: version
        run: |
          if [ ! -f "CHANGELOG.md" ]; then
            echo "CHANGELOG.md not found!"
            exit 1
          fi
          
          # Extract the first version header (latest version)
          VERSION=$(grep -m 1 "^## v" CHANGELOG.md | sed 's/^## v\([0-9.]*\).*/\1/')
          
          if [ -z "$VERSION" ]; then
            echo "No version found in CHANGELOG.md!"
            exit 1
          fi
          
          TAG_NAME="v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION (tag: $TAG_NAME)"

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          # Extract content between this version and the next version header
          RELEASE_NOTES=$(awk "/## v$VERSION/,/^## v[0-9]/" CHANGELOG.md | sed '1d;$d')
          
          if [ -z "$RELEASE_NOTES" ]; then
            echo "No release notes found for v$VERSION!"
            exit 1
          fi
          
          # Save to output using heredoc
          {
            echo 'notes<<EOF'
            echo "$RELEASE_NOTES"
            echo 'EOF'
          } >> $GITHUB_OUTPUT
          
          echo "Successfully extracted release notes for v$VERSION"

      - name: Create or update draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ClawdBot Control Panel ${{ steps.version.outputs.tag }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
